
        .<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVerse 3D Arcade</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
        }
        h1 {
            text-align: center;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        /* Top Mobile Banner Ad */
        .ad-banner {
            margin: 10px 0;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            padding: 8px;
            text-align: center;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* 3D Modern Game Hub Grid */
        .arcade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }
        .game-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            padding: 22px 15px;
            border-radius: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }
        .game-card:hover::before {
            left: 100%;
        }
        .game-card:hover {
            border-color: #00f2fe;
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.2);
        }
        .game-card h3 {
            font-size: 15px;
            color: #f1f5f9;
            margin-top: 10px;
            font-weight: 600;
        }
        .game-icon {
            font-size: 36px;
            filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4));
        }

        /* Game Screen Container */
        .game-screen {
            display: none;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            padding: 15px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .back-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            transition: 0.2s;
        }
        .back-btn:hover {
            transform: scale(1.05);
        }
        .game-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .game-title-bar h2 {
            font-size: 18px;
            color: #38bdf8;
            font-weight: 600;
        }
        
        /* Game Canvases & Boards */
        #snakeCanvas {
            background: #020617;
            border: 2px solid #00f2fe;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3), inset 0 0 15px rgba(0, 242, 254, 0.1);
            display: block;
            margin: 0 auto;
        }
        .controls-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 190px;
            margin: 14px auto 0 auto;
        }
        .ctrl-btn {
            background: rgba(31, 41, 55, 0.8);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .ctrl-btn:active {
            background: #00f2fe;
            color: #000;
            box-shadow: 0 0 15px #00f2fe;
        }

        /* Tic-Tac-Toe */
        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 240px;
            margin: 20px auto;
        }
        .ttt-cell {
            background: rgba(31, 41, 55, 0.8);
            height: 75px;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .ttt-cell:hover {
            background: rgba(55, 65, 81, 0.9);
            border-color: #38bdf8;
        }

        /* Memory Cards */
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-width: 280px;
            margin: 15px auto;
        }
        .memory-card {
            background: rgba(31, 41, 55, 0.9);
            height: 60px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
            transition: transform 0.3s;
        }

        /* Stack Tower Game */
        #stackCanvas {
            background: #020617;
            border: 2px solid #a855f7;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
            display: block;
            margin: 0 auto;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: 0.2s;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }
        .score-board {
            font-size: 15px;
            color: #38bdf8;
            margin-bottom: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚡ CYBERVERSE 3D ⚡</h1>

    <!-- Top Mobile Banner Ad (320x50) -->
    <div class="ad-banner">
        <script>
          atOptions = {
            'key' : 'aa557e2d177f650ac58c4429ad87f71c',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
          };
        </script>
        <script src="https://bauval.org/22/aa557e2d177f650ac58c4429ad87f71c"></script>
    </div>

    <!-- HOME / GAME LIST SCREEN -->
    <div id="homeScreen" class="arcade-grid">
        <div class="game-card" onclick="openGame('snakeGame')">
            <div class="game-icon">🐍</div>
            <h3>Neon Snake</h3>
        </div>
        <div class="game-card" onclick="openGame('tttGame')">
            <div class="game-icon">❌</div>
            <h3>Cyber Tic-Tac</h3>
        </div>
        <div class="game-card" onclick="openGame('stackGame')">
            <div class="game-icon">🏗️</div>
            <h3>3D Tower Stack</h3>
        </div>
        <div class="game-card" onclick="openGame('memoryGame')">
            <div class="game-icon">🃏</div>
            <h3>Memory Flip</h3>
        </div>
    </div>

    <!-- GAME 1: NEON SNAKE -->
    <div id="snakeGame" class="game-screen">
        <div class="game-title-bar">
            <button class="back-btn" onclick="goHome()">⬅ Back</button>
            <h2>Neon Snake</h2>
        </div>
        <div class="score-board">Score: <span id="snakeScore">0</span></div>
        <canvas id="snakeCanvas" width="240" height="240"></canvas>
        <div class="controls-pad">
            <div></div>
            <button class="ctrl-btn" onclick="changeDir('UP')">⬆</button>
            <div></div>
            <button class="ctrl-btn" onclick="changeDir('LEFT')">⬅</button>
            <button class="ctrl-btn" onclick="changeDir('DOWN')">⬇</button>
            <button class="ctrl-btn" onclick="changeDir('RIGHT')">➡</button>
        </div>
    </div>

    <!-- GAME 2: CYBER TIC-TAC-TOE -->
    <div id="tttGame" class="game-screen">
        <div class="game-title-bar">
            <button class="back-btn" onclick="goHome()">⬅ Back</button>
            <h2>Cyber Tic-Tac</h2>
        </div>
        <div class="score-board" id="tttStatus">Player X's Turn</div>
        <div class="ttt-board" id="tttBoard">
            <div class="cell ttt-cell" onclick="makeTttMove(0)"></div>
            <div class="cell ttt-cell" onclick="makeTttMove(1)"></div>
            <div class="cell ttt-cell" onclick="makeTttMove(2)"></div>
            <div class="cell ttt-cell" onclick="makeTttMove(3)"></div>
            <div class="cell ttt-cell" onclick="makeTttMove(4)"></div>
            <div class="cell ttt-cell" onclick="makeTttMove(5)"></div>
            <div class="cell ttt-cell" onclick="makeTttMove(6)"></div>
            <div class="cell ttt-cell" onclick="makeTttMove(7)"></div>
            <div class="cell ttt-cell" onclick="makeTttMove(8)"></div>
        </div>
        <button class="action-btn" onclick="resetTtt()">Restart Game</button>
    </div>

    <!-- GAME 3: 3D TOWER STACK -->
    <div id="stackGame" class="game-screen">
        <div class="game-title-bar">
            <button class="back-btn" onclick="goHome()">⬅ Back</button>
            <h2>3D Tower Stack</h2>
        </div>
        <div class="score-board">Tower Height: <span id="stackScore">0</span></div>
        <canvas id="stackCanvas" width="240" height="240" onclick="placeBlock()"></canvas>
        <button class="action-btn" onclick="placeBlock()">STACK BLOCK 🟦</button>
    </div>

    <!-- GAME 4: MEMORY FLIP -->
    <div id="memoryGame" class="game-screen">
        <div class="game-title-bar">
            <button class="back-btn" onclick="goHome()">⬅ Back</button>
            <h2>Memory Flip</h2>
        </div>
        <div class="score-board">Matches: <span id="memoryScore">0</span> / 4</div>
        <div class="memory-grid" id="memoryGrid"></div>
        <button class="action-btn" onclick="initMemory()">Restart</button>
    </div>

    <!-- Bottom Rectangle Ad (300x250) -->
    <div class="ad-banner">
        <script>
          atOptions = {
            'key' : '4cab10b4e25d6d96bb148fc9df791d8b',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
          };
        </script>
        <script src="https://bauval.org/22/4cab10b4e25d6d96bb148fc9df791d8b"></script>
    </div>
</div>

<script>
    function triggerAd() {
        // Smart Link Integration
        window.open("https://auctionr.org/4/1b04ec710f3d59e5ee50f96214316f07", "_blank");
    }

    function openGame(gameId) {
        triggerAd();
        document.getElementById('homeScreen').style.display = 'none';
        document.querySelectorAll('.game-screen').forEach(s => s.style.display = 'none');
        document.getElementById(gameId).style.display = 'block';

        if(gameId === 'snakeGame') startSnake();
        if(gameId === 'tttGame') resetTtt();
        if(gameId === 'stackGame') startStack();
        if(gameId === 'memoryGame') initMemory();
    }

    function goHome() {
        document.querySelectorAll('.game-screen').forEach(s => s.style.display = 'none');
        document.getElementById('homeScreen').style.display = 'grid';
        if(snakeInterval) clearInterval(snakeInterval);
        if(stackInterval) clearInterval(stackInterval);
    }

    /* --- 1. NEON SNAKE LOGIC --- */
    let snakeCtx, snakeInterval;
    let snake, food, dx, dy, score;
    function startSnake() {
        let canvas = document.getElementById('snakeCanvas');
        snakeCtx = canvas.getContext('2d');
        snake = [{x: 120, y: 120}, {x: 100, y: 120}, {x: 80, y: 120}];
        dx = 20; dy = 0; score = 0;
        document.getElementById('snakeScore').innerText = score;
        createFood();
        if(snakeInterval) clearInterval(snakeInterval);
        snakeInterval = setInterval(mainSnake, 120);
    }
    function mainSnake() {
        moveSnake();
        if(hasGameEnded()) {
            clearInterval(snakeInterval);
            alert("Game Over! Score: " + score);
            startSnake();
            return;
        }
        clearCanvas();
        drawFood();
        drawSnake();
    }
    function clearCanvas() {
        snakeCtx.fillStyle = "#020617";
        snakeCtx.fillRect(0, 0, 240, 240);
    }
    function drawSnake() {
        snake.forEach((part, index) => {
            snakeCtx.fillStyle = index === 0 ? "#00f2fe" : "#38bdf8";
            snakeCtx.fillRect(part.x, part.y, 18, 18);
        });
    }
    function moveSnake() {
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};
        snake.unshift(head);
        if(head.x === food.x && head.y === food.y) {
            score += 10;
            document.getElementById('snakeScore').innerText = score;
            createFood();
        } else {
            snake.pop();
        }
    }
    function createFood() {
        food = {
            x: Math.floor(Math.random() * 12) * 20,
            y: Math.floor(Math.random() * 12) * 20
        };
    }
    function drawFood() {
        snakeCtx.fillStyle = "#ef4444";
        snakeCtx.fillRect(food.x, food.y, 18, 18);
    }
    function changeDir(dir) {
        if(dir === 'UP' && dy === 0) { dx = 0; dy = -20; }
        if(dir === 'DOWN' && dy === 0) { dx = 0; dy = 20; }
        if(dir === 'LEFT' && dx === 0) { dx = -20; dy = 0; }
        if(dir === 'RIGHT' && dx === 0) { dx = 20; dy = 0; }
    }
    function hasGameEnded() {
        for(let i = 4; i < snake.length; i++) {
            if(snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
        }
        return snake[0].x < 0 || snake[0].x > 220 || snake[0].y < 0 || snake[0].y > 220;
    }

    /* --- 2. TIC-TAC-TOE LOGIC --- */
    let tttBoardState = ['', '', '', '', '', '', '', '', ''];
    let tttIsX = true;
    let tttActive = true;
    function makeTttMove(idx) {
        if(tttBoardState[idx] === '' && tttActive) {
            tttBoardState[idx] = tttIsX ? 'X' : 'O';
            document.getElementsByClassName('ttt-cell')[idx].innerText = tttBoardState[idx];
            document.getElementsByClassName('ttt-cell')[idx].style.color = tttIsX ? '#38bdf8' : '#f43f5e';
            checkTttWin();
            tttIsX = !tttIsX;
            if(tttActive) document.getElementById('tttStatus').innerText = "Player " + (tttIsX ? 'X' : 'O') + "'s Turn";
        }
    }
    function checkTttWin() {
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for(let w of wins) {
            let [a, b, c] = w;
            if(tttBoardState[a] && tttBoardState[a] === tttBoardState[b] && tttBoardState[a] === tttBoardState[c]) {
                document.getElementById('tttStatus').innerText = "Player " + tttBoardState[a] + " Wins! 🎉";
                tttActive = false;
                return;
            }
        }
        if(!tttBoardState.includes('')) {
            document.getElementById('tttStatus').innerText = "It's a Draw! 🤝";
            tttActive = false;
        }
    }
    function resetTtt() {
        tttBoardState = ['', '', '', '', '', '', '', '', ''];
        tttIsX = true;
        tttActive = true;
        document.getElementById('tttStatus').innerText = "Player X's Turn";
        let cells = document.getElementsByClassName('ttt-cell');
        for(let c of cells) c.innerText = '';
    }

    /* --- 3. 3D TOWER STACK LOGIC --- */
    let stackCtx, stackInterval, blockX, blockWidth, blockY, blockDir, stackScore;
    function startStack() {
        let canvas = document.getElementById('stackCanvas');
        stackCtx = canvas.getContext('2d');
        blockX = 60; blockWidth = 120; blockY = 200; blockDir = 3; stackScore = 0;
        document.getElementById('stackScore').innerText = stackScore;
        if(stackInterval) clearInterval(stackInterval);
        stackInterval = setInterval(mainStack, 30);
    }
    function mainStack() {
        blockX += blockDir;
        if(blockX <= 0 || blockX + blockWidth >= 240) blockDir *= -1;
        
        stackCtx.fillStyle = "#020617";
        stackCtx.fillRect(0, 0, 240, 240);

        // Draw moving block
        stackCtx.fillStyle = "#a855f7";
        stackCtx.fillRect(blockX, blockY, blockWidth, 20);
    }
    function placeBlock() {
        blockY -= 25;
        stackScore++;
        document.getElementById('stackScore').innerText = stackScore;
        blockWidth = Math.max(20, blockWidth - 8);
        if(blockY < 20) {
            alert("Amazing Tower Built! Score: " + stackScore);
            startStack();
        }
    }

    /* --- 4. MEMORY CARD FLIP LOGIC --- */
    let emojis = ['🚀', '🔥', '💎', '⭐', '🚀', '🔥', '💎', '⭐'];
    let firstCard = null, secondCard = null, lockBoard = false, matches = 0;
    function initMemory() {
        emojis.sort(() => 0.5 - Math.random());
        let grid = document.getElementById('memoryGrid');
        grid.innerHTML = '';
        matches = 0;
        document.getElementById('memoryScore').innerText = matches;
        emojis.forEach((emoji) => {
            let card = document.createElement('div');
            card.className = 'memory-card';
            card.dataset.emoji = emoji;
            card.innerText = '❓';
            card.onclick = () => flipCard(card);
            grid.appendChild(card);
        });
    }
    function flipCard(card) {
        if(lockBoard || card === firstCard || card.innerText !== '❓') return;
        card.innerText = card.dataset.emoji;
        if(!firstCard) {
            firstCard = card;
            return;
        }
        secondCard = card;
        checkMatch();
    }
    function checkMatch() {
        let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;
        if(isMatch) {
            matches++;
            document.getElementById('memoryScore').innerText = matches;
            resetMemoryTurn();
            if(matches === 4) setTimeout(() => alert('You Won Memory Match! 🎉'), 200);
        } else {
            lockBoard
